name: CD - Build & Release Executables

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2026.1, etc.

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Ensures one OS failure won't kill other builds prematurely
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python Dependencies
      shell: bash # <--- Add this line here to force Windows to use Bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Executable with PyInstaller
      run: |
        python -c "
        import PyInstaller.__main__, sys
        sep = ';' if sys.platform == 'win32' else ':'
        PyInstaller.__main__.run([
            'vampio.py',
            '--noconfirm',
            '--onefile',
            '--windowed',
            '--name=Vampio',
            '--paths=.',
            f'--add-data=writers{sep}writers',
            '--collect-all=writers'
        ])
        "

    # --- CROSS-PLATFORM HEADLESS SMOKE TESTS ---
    - name: Smoke Test (Linux Execution)
      if: runner.os == 'Linux'
      run: |
        # Runs the GUI app inside a virtual desktop frame buffer.
        # If the app launches successfully, it hangs in loop, timeout returns 124 (Pass).
        # If it crashes immediately due to missing modules, it returns 1 (Fail).
        timeout 8 xvfb-run ./dist/Vampio || exit_code=$?
        if [ "$exit_code" -eq 124 ]; then
          echo "Smoke test passed: Executable initialized flawlessly."
        else
          echo "Smoke test failed: App crashed instantly with exit code $exit_code"
          exit 1
        fi

    - name: Smoke Test (macOS Execution)
      if: runner.os == 'macOS'
      run: |
        ./dist/Vampio &
        APP_PID=$!
        
        sleep 8

        if kill -0 $APP_PID 2>/dev/null; then
          echo "Smoke test passed: Executable initialized flawlessly."
          kill -9 $APP_PID # Cleanly terminate the test app
        else
          echo "Smoke test failed: App crashed instantly upon launch."
          exit 1
        fi

    - name: Smoke Test (Windows Execution)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Spawns process asynchronously, sleeps, then evaluates if it stayed alive.
        $proc = Start-Process -FilePath "dist/Vampio.exe" -PassThru -NoNewWindow
        Start-Sleep -Seconds 8
        if ($proc.HasExited) {
            Write-Error "Smoke test failed: Application crashed instantly upon launch."
            exit 1
        } else {
            Write-Output "Smoke test passed: Executable initialized flawlessly."
            Stop-Process -Id $proc.Id -Force
        }

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vampio-${{ runner.os }}
        path: dist/*
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Zip Artifacts for Release
      run: |
        cd artifacts
        zip -r Vampio-Linux.zip Vampio-Linux/
        zip -r Vampio-Windows.zip Vampio-Windows/
        zip -r Vampio-macOS.zip Vampio-macOS/

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/Vampio-Linux.zip
          artifacts/Vampio-Windows.zip
          artifacts/Vampio-macOS.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
