name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Empty = tag on the selected ref / latest tag.'
        required: false
        default: ''
      draft:
        description: 'Keep the release as a draft (do not publish automatically)'
        type: boolean
        required: false
        default: false

# Never run two releases for the same tag at once, and never cancel one midway.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve tag/version, generate notes, create ONE draft release.
  #    Creating the draft here (not in each matrix job) avoids the race where
  #    three parallel builds each try to create the release.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
      tag_exists: ${{ steps.notes.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve tag, version and release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-release-notes.cjs

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 7

      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          VERSION: ${{ steps.notes.outputs.version }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; builds will upload into it."
            exit 0
          fi
          args=(--draft --title "VAMPIO v$VERSION" --notes-file release_notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"

  # ---------------------------------------------------------------------------
  # 2. Gate: don't spend 3 x runner-minutes on installers if tests fail.
  # ---------------------------------------------------------------------------
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_exists == 'true' && needs.prepare.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------------------
  # 3. Build installers on each OS and attach them to the draft release.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ''
            rust_targets: ''
          - name: macOS universal
            platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: Linux x64
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_exists == 'true' && needs.prepare.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/sync-version.cjs

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The lockfile already contains every platform's optional native
      # packages, so a plain `npm ci` is correct on all three runners.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build & upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'VAMPIO v${{ needs.prepare.outputs.version }}'
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 4. Publish only if every platform produced its installers.
  # ---------------------------------------------------------------------------
  publish:
    name: Verify assets & publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Verify every platform's installer is attached
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort | tee assets.txt
          missing=0
          check() {
            if ! grep -Eq "$1" assets.txt; then
              echo "::error::Missing release asset: $2"
              missing=1
            fi
          }
          check '\.msi$'        'Windows .msi'
          check '(setup\.exe)$' 'Windows .exe (NSIS) installer'
          check '\.dmg$'        'macOS .dmg'
          check '\.deb$'        'Linux .deb'
          check '\.AppImage$'   'Linux .AppImage'
          exit $missing

      - name: Publish release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.draft) }}
        run: |
          args=(--draft=false --notes-file release_notes.md --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); else args+=(--latest); fi
          gh release edit "$TAG" "${args[@]}"

      - name: Left as draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: echo "Release $TAG left as a draft as requested. Publish it from the Releases page."
