[package]
name = "vampio"
version = "1.0.0"
description = "VAMPIO - Synthetic Data Generator & Architecture Extractor"
authors = ["VAMPIO Team"]
edition = "2021"

[lib]
name = "vampio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
