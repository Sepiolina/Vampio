[package]
name = "vampio"
version = "1.0.0"
description = "VAMPIO - Synthetic Data Generator & Architecture Extractor"
authors = ["VAMPIO Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vampio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
